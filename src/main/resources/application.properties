# Local DB (Environment Variables) - Active:
#spring.datasource.url=jdbc:postgresql://localhost:5432/comiverse
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# M?i ?nh t?i ?a 10MB
spring.servlet.multipart.max-file-size=10MB

# T?ng m?t l?n upload chapter t?i ?a 100MB
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:100MB}

# 200 ?nh + c�c field chapterNumber, title, relativePathsJson...
server.tomcat.max-part-count=${TOMCAT_MAX_PART_COUNT:250}

server.servlet.context-path=/api
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.com.sep.comiverse=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=OFF

# JWT Configuration
app.auth.tokenSecret=${JWT_SECRET}
app.auth.tokenExpirationMs=86400000

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.authorizedRedirectUri=${AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# Email Configuration
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.smtp-from=${SMTP_FROM:}
app.mail.smtp-from-name=${SMTP_FROM_NAME:ComiVerse}

# Gmail SMTP. Store the Gmail address and 16-character App Password in environment variables.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Optional Resend fallback. Set MAIL_PROVIDER=resend to use it.
resend.api-key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:ComiVerse <onboarding@resend.dev>}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Stripe Sandbox Subscription Billing
# Use only test-mode values locally: sk_test_... and whsec_...
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:}

#Cloudinary Configuration
cloudinary.cloud-name=${CLOUD_USERNAME}
cloudinary.api-key=${CLOUD_KEY}
cloudinary.api-secret=${CLOUD_SECRET}
cloudinary.chapter-folder=comiverse/chapters
author.chapter.max-pages=200
# Reader access: chapter numbers 1..N are free; later chapters require active Premium
premium.free-chapter-count=${PREMIUM_FREE_CHAPTER_COUNT:2}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.vision.model=${GEMINI_VISION_MODEL:gemini-flash-latest}

# Firebase Cloud Messaging. Keep disabled until Railway has either
# FIREBASE_SERVICE_ACCOUNT_BASE64 / FIREBASE_SERVICE_ACCOUNT_JSON or
# GOOGLE_APPLICATION_CREDENTIALS configured.
firebase.push.enabled=${FIREBASE_PUSH_ENABLED:false}
firebase.push.project-id=${FIREBASE_PROJECT_ID:}
firebase.push.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.push.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}

logging.level.org.springframework.web.context.request.async=WARN
logging.level.org.apache.catalina.connector=WARN

stripe.connect.recipient-countries=${STRIPE_CONNECT_RECIPIENT_COUNTRIES:VN}
payout.allow-current-month=${PAYOUT_ALLOW_CURRENT_MONTH:true}