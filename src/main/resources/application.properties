#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.servlet.context-path=/api

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.com.sep.comiverse=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=OFF

# JWT Configuration
app.auth.tokenSecret=${JWT_SECRET}
app.auth.tokenExpirationMs=86400000

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.authorizedRedirectUri=${AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# Email Configuration - Resend
resend.api-key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:ComiVerse <onboarding@resend.dev>}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:}

#Cloudinary Configuration
cloudinary.cloud-name=${CLOUD_USERNAME}
cloudinary.api-key=${CLOUD_KEY}
cloudinary.api-secret=${CLOUD_SECRET}
cloudinary.chapter-folder=comiverse/chapters
author.chapter.max-pages=200

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.vision.model=${GEMINI_VISION_MODEL:gemini-flash-latest}
