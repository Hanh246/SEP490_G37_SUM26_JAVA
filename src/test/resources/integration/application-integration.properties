spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:comiverse_it;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:schema-h2.sql'}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.hbm2ddl=WARN
logging.level.org.springframework.security=WARN

spring.cache.type=none
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.data.redis.host=${TEST_REDIS_HOST:localhost}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
spring.task.scheduling.enabled=false
firebase.push.enabled=false
app.auth.tokenSecret=test-jwt-secret-for-comiverse-context-loads-1234567890
app.auth.tokenExpirationMs=86400000
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
app.oauth2.authorizedRedirectUri=http://localhost:5173/oauth2/redirect
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test-password
cloudinary.cloud-name=mock-cloud-name
cloudinary.api-key=mock-api-key
cloudinary.api-secret=mock-api-secret
gemini.api.key=test-gemini-key
sendgrid.api.key=
app.mail.provider=smtp
