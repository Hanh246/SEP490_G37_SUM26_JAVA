spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:comiverse_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=${TEST_DB_DIALECT:org.hibernate.dialect.H2Dialect}
app.auth.tokenSecret=test-jwt-secret-for-comiverse-context-loads-1234567890
app.auth.tokenExpirationMs=86400000
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
app.oauth2.authorizedRedirectUri=http://localhost:5173/oauth2/redirect
spring.mail.username=test@example.com
spring.mail.password=test-password
cloudinary.cloud-name=mock-cloud-name
cloudinary.api-key=mock-api-key
cloudinary.api-secret=mock-api-secret
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
