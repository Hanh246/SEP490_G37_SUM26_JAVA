services:
  # Spring Boot Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8082:8081"

    env_file:
      - key.env

    environment:
      - SPRING_PROFILES_ACTIVE=prod

      # Standard Spring Boot Data Redis properties
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

      # Explicit application properties
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # Internal Spring Boot port
      - PORT=8081
      - PREMIUM_FREE_CHAPTER_COUNT=${PREMIUM_FREE_CHAPTER_COUNT:-2}
    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  # Redis Cache Service
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data: